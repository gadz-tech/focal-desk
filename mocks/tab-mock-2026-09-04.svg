  <path data-vs="1" data-vs-pts="1398,672 1868,672 1868,1058 1398,1058" data-vs-closed="1" data-vs-fillets="0:20,1:20,2:20,3:20" d="M 1418,672 L 1848,672 A 20 20 0 0 1 1868,692 L 1868,1038 A 20 20 0 0 1 1848,1058 L 1418,1058 A 20 20 0 0 1 1398,1038 L 1398,692 A 20 20 0 0 1 1418,672 Z" fill="url(#frost)" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.2"/>
  <rect x="1438" y="678" width="424" height="344" rx="14" fill="#14140F" fill-opacity="0.85" filter="url(#fade)"/>
  <path data-vs="1" data-vs-pts="1440,680 1860,680 1860,1020 1440,1020" data-vs-closed="1" data-vs-fillets="0:12,1:12,2:12,3:12" d="M 1452,680 L 1848,680 A 12 12 0 0 1 1860,692 L 1860,1008 A 12 12 0 0 1 1848,1020 L 1452,1020 A 12 12 0 0 1 1440,1008 L 1440,692 A 12 12 0 0 1 1452,680 Z" fill="#23221E" stroke="#3A3934" stroke-width="1"/>
