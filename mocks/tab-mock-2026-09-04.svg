  <circle cx="1419" cy="710" r="7" fill="#2FE6FF" fill-opacity="0.9" stroke="#E8FBFF" stroke-width="1.5" filter="url(#neon)"/>
  <circle cx="1419" cy="990" r="7" fill="none" stroke="#C9CDD2" stroke-opacity="0.75" stroke-width="2"/>
  <rect x="1455" y="1033" width="390" height="20" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1"/>
  <text x="1465" y="1046" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#F4F0E7" fill-opacity="0.35">notification · one line · later</text>

  <!-- top: frame (behind), fade, window (on top), then the thick-side furniture -->
  <path data-vs="1" data-vs-pts="592,0 1328,0 1328,116 592,116" data-vs-closed="1" data-vs-fillets="0:20,1:20,2:20,3:20" d="M 612,0 L 1308,0 A 20 20 0 0 1 1328,20 L 1328,96 A 20 20 0 0 1 1308,116 L 612,116 A 20 20 0 0 1 592,96 L 592,20 A 20 20 0 0 1 612,0 Z" fill="url(#frost)" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.2"/>
  <rect x="598" y="6" width="724" height="70" rx="14" fill="#14140F" fill-opacity="0.85" filter="url(#fade)"/>
  <path data-vs="1" data-vs-pts="600,8 1320,8 1320,74 600,74" data-vs-closed="1" data-vs-fillets="0:12,1:12,2:12,3:12" d="M 612,8 L 1308,8 A 12 12 0 0 1 1320,20 L 1320,62 A 12 12 0 0 1 1308,74 L 612,74 A 12 12 0 0 1 600,62 L 600,20 A 12 12 0 0 1 612,8 Z" fill="#23221E" stroke="#3A3934" stroke-width="1"/>
  <rect x="860.0" y="82" width="200" height="3" rx="1.5" fill="#2FE6FF" filter="url(#neon)"/>
  <rect x="860" y="90" width="200" height="21" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1"/>
