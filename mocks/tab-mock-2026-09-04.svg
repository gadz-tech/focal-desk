  <circle cx="551" cy="850" r="6" fill="#2FE6FF" fill-opacity="0.9" stroke="#E8FBFF" stroke-width="1" filter="url(#neon)"/>
  <path d="M 1419,370 L 1378,370" fill="none" stroke="#2FE6FF" stroke-width="2" stroke-opacity="0.9" filter="url(#wireglow)"/>
  <circle cx="1369" cy="370" r="6" fill="#2FE6FF" fill-opacity="0.9" stroke="#E8FBFF" stroke-width="1" filter="url(#neon)"/>
