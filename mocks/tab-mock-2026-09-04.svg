  <circle cx="630" cy="155" r="6" fill="#2FE6FF" fill-opacity="0.9" stroke="#E8FBFF" stroke-width="1" filter="url(#neon)"/>
  <text x="960.0" y="542.0" font-family="Segoe UI, Inter, sans-serif" font-size="26" fill="#E6A23C" fill-opacity="0.9" text-anchor="middle">STAGE</text>
  <text x="960.0" y="568.0" font-family="Segoe UI, Inter, sans-serif" font-size="15" fill="#F4F0E7" fill-opacity="0.55" text-anchor="middle">border all round, just wide enough for the landings · no tab · it already has focus</text>
  <text x="260" y="540" font-family="Segoe UI, Inter, sans-serif" font-size="15" fill="#F4F0E7" fill-opacity="0.55" text-anchor="middle">side window</text>
  <text x="260" y="562" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#F4F0E7" fill-opacity="0.4" text-anchor="middle">frame BEHIND the window · slim ×3 · thick toward center</text>
  <text x="1650" y="230" font-family="Segoe UI, Inter, sans-serif" font-size="15" fill="#F4F0E7" fill-opacity="0.5" text-anchor="middle">terminal — corner slot</text>
  <text x="1650" y="850" font-family="Segoe UI, Inter, sans-serif" font-size="15" fill="#F4F0E7" fill-opacity="0.5" text-anchor="middle">mail — bottom slot</text>
  <text x="960" y="48" font-family="Segoe UI, Inter, sans-serif" font-size="15" fill="#F4F0E7" fill-opacity="0.5" text-anchor="middle">household — top slot</text>
  <text x="70" y="1040" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#F4F0E7" fill-opacity="0.45" text-anchor="start">thick side: strip centred (vertical) / offset toward the window (horizontal) · holes at the ENDS — neon when wired, silver when free · wires land on the stage border</text>
  <text x="70" y="1062" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#F4F0E7" fill-opacity="0.35" text-anchor="start">frosted = one gradual gradient, no sheen, no horizon line (real build: DWM acrylic) · notification box INSIDE the glass: foot band (vertical) / under the strip (horizontal) — later</text>
</svg>