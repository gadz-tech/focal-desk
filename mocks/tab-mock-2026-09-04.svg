  <rect x="1438" y="58" width="424" height="344" rx="14" fill="#14140F" fill-opacity="0.85" filter="url(#fade)"/>
  <path data-vs="1" data-vs-pts="1440,60 1860,60 1860,400 1440,400" data-vs-closed="1" data-vs-fillets="0:12,1:12,2:12,3:12" d="M 1452,60 L 1848,60 A 12 12 0 0 1 1860,72 L 1860,388 A 12 12 0 0 1 1848,400 L 1452,400 A 12 12 0 0 1 1440,388 L 1440,72 A 12 12 0 0 1 1452,60 Z" fill="#23221E" stroke="#3A3934" stroke-width="1"/>
